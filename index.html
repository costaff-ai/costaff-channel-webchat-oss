<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CoStaff WebChat</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/main.css">
    <script>
        if (!localStorage.getItem('webchat_token')) window.location.href = '/login.html';
        tailwind.config = { darkMode: 'class', theme: { extend: {} } };
    </script>
</head>
<body class="flex h-screen overflow-hidden" style="background:var(--bg-main);color:var(--on-surface)">

    <!-- Ambient background -->
    <div class="ambient-blobs pointer-events-none">
        <div class="blob w-[700px] h-[900px] bg-blue-600/10 top-[-10%] left-1/2 -translate-x-1/2"></div>
    </div>
    <div class="grid-overlay pointer-events-none"></div>

    <!-- Sidebar -->
    <aside id="sidebar" style="width:220px;background:var(--surface-low);border-right:1px solid var(--dm-border)" class="flex flex-col flex-shrink-0">
        <div class="p-6 pb-4">
            <div class="flex items-center gap-3" style="color:var(--primary)">
                <i class="fas fa-robot text-2xl"></i>
                <span class="text-xl font-bold" style="font-family:'Space Grotesk',sans-serif;color:var(--on-surface)">CoStaff</span>
            </div>
        </div>

        <nav class="flex-1 px-3 py-2">
            <div class="sidebar-group-label">Workspace</div>
            <div class="sidebar-item active w-full flex items-center gap-3 px-4 py-3 rounded-xl">
                <i class="fas fa-comments w-4 text-center"></i>
                <span>Chat</span>
            </div>
        </nav>

        <div class="p-4 border-t" style="border-color:var(--dm-border)">
            <div class="px-4 py-2 mb-2 rounded-xl" style="background:var(--surface-container)">
                <div class="text-xs font-bold uppercase mb-1" style="color:var(--dm-text-muted);letter-spacing:.08em;font-family:'Space Grotesk',sans-serif">Signed in as</div>
                <div id="user-display-name" class="text-sm font-semibold truncate" style="color:var(--on-surface)">—</div>
                <div id="user-display-email" class="text-xs truncate" style="color:var(--dm-text-muted)">—</div>
            </div>
            <button id="btn-logout" class="w-full flex items-center gap-3 px-4 py-2.5 rounded-xl text-sm font-bold transition-all" style="color:var(--dm-text-secondary)" onmouseover="this.style.background='rgba(239,68,68,.1)';this.style.color='#ef4444'" onmouseout="this.style.background='';this.style.color='var(--dm-text-secondary)'">
                <i class="fas fa-power-off w-4 text-center"></i> Logout
            </button>
        </div>
    </aside>

    <!-- Main chat area -->
    <main class="flex-1 flex flex-col min-w-0">
        <!-- Header -->
        <header class="flex items-center justify-between px-8 h-16 flex-shrink-0" style="border-bottom:1px solid var(--dm-border)">
            <div class="flex items-center gap-3">
                <h2 class="text-lg font-bold" style="font-family:'Space Grotesk',sans-serif">Team Chat</h2>
                <span id="status-badge" class="status-badge badge-live">
                    <span class="badge-dot"></span> Connected
                </span>
            </div>
            <button id="btn-reset" title="Reset conversation" class="flex items-center gap-2 px-3 py-1.5 rounded-lg text-xs font-bold uppercase tracking-wide transition-all" style="font-family:'Space Grotesk',sans-serif;background:var(--surface-container);color:var(--dm-text-secondary);border:1px solid var(--dm-border)" onmouseover="this.style.borderColor='var(--primary)';this.style.color='var(--primary)'" onmouseout="this.style.borderColor='var(--dm-border)';this.style.color='var(--dm-text-secondary)'">
                <i class="fas fa-rotate-right"></i> Reset
            </button>
        </header>

        <!-- Pending approval banner -->
        <div id="pending-banner" class="hidden items-center gap-3 px-8 py-3 text-sm font-semibold" style="background:rgba(245,158,11,.1);border-bottom:1px solid rgba(245,158,11,.2);color:#f59e0b">
            <i class="fas fa-clock"></i>
            Your account is pending admin approval. You'll be able to chat once approved.
        </div>

        <!-- Messages -->
        <div id="chat-messages" class="flex-1 overflow-y-auto px-8 py-6 flex flex-col gap-4 custom-scrollbar">
            <div class="chat-msg system">Welcome to CoStaff WebChat. Type <code>/help</code> to see available commands.</div>
        </div>

        <!-- Input area -->
        <div class="px-8 pb-6 pt-3 flex-shrink-0">
            <!-- Slash command dropdown -->
            <div id="slash-menu" class="hidden mb-2 rounded-xl overflow-hidden" style="background:var(--surface-container);border:1px solid var(--dm-border);box-shadow:0 8px 24px rgba(0,0,0,.4)">
                <div class="px-3 py-2 text-xs font-bold uppercase tracking-widest" style="color:var(--dm-text-muted);font-family:'Space Grotesk',sans-serif;border-bottom:1px solid var(--dm-border)">Commands</div>
            </div>

            <!-- File preview bar -->
            <div id="file-preview-bar" class="hidden mb-2 flex flex-wrap gap-2"></div>

            <div class="flex items-end gap-2 rounded-2xl" style="background:var(--surface-container);border:1px solid var(--dm-border);padding:8px 10px" id="input-container">
                <label id="btn-attach" title="Attach file" class="flex-shrink-0 flex items-center justify-center transition-all cursor-pointer" style="width:26px;height:26px;border-radius:8px;background:var(--surface-high);color:var(--dm-text-secondary)">
                    <i class="fas fa-paperclip" style="font-size:11px"></i>
                    <input id="file-input" type="file" class="hidden" multiple accept="image/*,.pdf,.csv,.xlsx,.xls,.txt,.docx,.md,.json,.zip">
                </label>
                <textarea id="user-input" rows="1" placeholder="Message CoStaff… or type / for commands" class="flex-1 resize-none outline-none text-sm leading-relaxed bg-transparent custom-scrollbar" style="color:var(--on-surface);font-family:'Manrope',sans-serif;overflow-y:hidden"></textarea>
                <button id="btn-mic" title="Voice input" class="flex-shrink-0 flex items-center justify-center transition-all" style="width:26px;height:26px;border-radius:8px;background:var(--surface-high);color:var(--dm-text-secondary)">
                    <i class="fas fa-microphone" style="font-size:11px"></i>
                </button>
                <button id="btn-send" class="flex-shrink-0 flex items-center justify-center transition-all" style="width:26px;height:26px;border-radius:8px;background:var(--primary-container);color:#fff">
                    <i class="fas fa-paper-plane" style="font-size:11px"></i>
                </button>
            </div>
            <p class="text-center mt-2 text-xs" style="color:var(--dm-text-muted)">Enter to send · Shift+Enter for new line · / for commands · <i class="fas fa-microphone"></i> for voice</p>
        </div>
    </main>

    <script src="js/app.js"></script>
</body>
</html>
