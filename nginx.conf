server {
    listen 80;
    server_name localhost;

    root /app/static;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /.well-known/agent-card.json {
        default_type application/json;
        return 200 '{"name": "webchat", "status": "healthy"}';
    }

    # SSE stream for async push frames — must NOT buffer, and needs a long
    # read timeout since the connection stays open (keepalive pings every 20s).
    location /api/stream {
        proxy_pass http://127.0.0.1:8000/api/stream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    # All /api/* proxied to FastAPI backend
    location /api/ {
        proxy_pass http://127.0.0.1:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
